name: NextJS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
        shell: bash

    strategy:
      matrix:
        node-version: [22]
      fail-fast: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup pnpm for existing lockfile
        if: ${{ hashFiles('bun.lock') == '' && hashFiles('pnpm-lock.yaml') != '' }}
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "No supported lockfile found" >&2
            exit 1
          fi

      - name: Run Biome
        run: bunx --no-install biome ci ./src
